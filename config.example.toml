# Copy to ~/.config/homenet/config.toml, or let `homenet init` write it.

domain = "home.arpa"              # optional; names become <name>.<domain>
default_host = "192.168.1.10"     # where your apps run: `homenet add notes 8080` -> 192.168.1.10:8080
app_ports = [8000, 8099]          # range `homenet port` picks free ports from
# open_ports = [3000]             # optional: if a firewall on default_host only lets Caddy reach
                                  # app_ports plus these, homenet warns about any other port

# `run` is the command that gives a root shell on that host; homenet appends `sh -s`.
# Examples: "ssh root@192.168.1.2", "ssh root@pve pct exec 100 --" (a Proxmox container),
# or "" for this machine (run homenet as root then).

[pihole]                          # Pi-hole v6
ip = "192.168.1.2"
run = "ssh root@192.168.1.2"

[caddy]
ip = "192.168.1.3"                # the address clients reach Caddy on
run = "ssh root@192.168.1.3"
caddyfile = "/etc/caddy/Caddyfile"  # path on the Caddy host
# docker = "caddy"                # set if Caddy runs in this container with the Caddyfile
                                  # bind-mounted at /etc/caddy/Caddyfile
